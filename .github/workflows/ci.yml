name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  issues:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  build:
    name: Build & verify bundle
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and compile
        run: npm run build

      - name: Bundle dist/index.js
        run: npm run package

      - name: Verify the committed bundle is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run all' and commit the result."
            git --no-pager diff --stat -- dist
            exit 1
          fi

  self-test:
    name: Self-test on this repository
    if: github.event_name == 'pull_request' || github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Repo Hygiene Action
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-issue-triage: 'true'
          enable-pr-title-check: 'true'
          enable-pr-audit: 'true'
          fail-on-audit: 'false'
